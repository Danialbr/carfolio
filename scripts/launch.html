<style id="azl-css">
.azl{position:fixed;inset:0;z-index:2147483000;pointer-events:none;overflow:hidden;background:radial-gradient(120% 80% at 50% 110%,rgba(240,138,93,.0),rgba(4,6,11,0) 60%);transition:background .7s ease,opacity .6s ease}
.azl.go{background:radial-gradient(120% 80% at 50% 110%,rgba(240,138,93,.45),rgba(4,6,11,.97) 60%)}
.azl.hold{background:#04060B}
.azl .sp{position:absolute;inset:-50% 0;opacity:0;background:repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.18) 23px 24px,transparent 24px 61px),repeating-linear-gradient(180deg,transparent 0 40px,rgba(4,6,11,.95) 40px 140px);transition:opacity .5s .35s}
.azl.go .sp{opacity:1;animation:azsp .35s linear infinite}
@keyframes azsp{to{transform:translateY(140px)}}
.azl .rk{position:absolute;left:50%;bottom:-160px;width:84px;transform:translateX(-50%);transition:bottom 1.35s cubic-bezier(.6,0,.8,.3) .2s}
.azl.go .rk{bottom:120%}
.azl .rk svg{width:84px;height:130px;display:block;filter:drop-shadow(0 0 18px rgba(255,170,90,.6))}
.azl .fl{transform-origin:50% 0;animation:azfl .08s ease-in-out infinite alternate}
@keyframes azfl{to{transform:scaleY(1.35) scaleX(.85)}}
.azl .tx{position:absolute;left:0;right:0;top:44%;text-align:center;font:800 13px/1.4 -apple-system,system-ui,sans-serif;letter-spacing:.32em;color:#F3D58A;opacity:0;transform:translateY(8px);transition:opacity .4s .2s,transform .5s .2s}
.azl .tx b{display:block;font-size:22px;letter-spacing:.12em;color:#fff;margin-top:6px}
.azl.go .tx{opacity:1;transform:none}
.azl.out{opacity:0}
.azl.land{background:rgba(4,6,11,.97);transition:opacity .8s ease .2s}.azl.land.out{opacity:0}
.azl.land .rk{bottom:auto;top:-170px;transition:top .9s cubic-bezier(.2,.7,.3,1)}.azl.land.in .rk{top:38%}
#azframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0;z-index:2147480000;background:#04060B;display:none}
</style>
<script>
(function(){
 var RK='<svg viewBox="0 0 84 130"><defs><linearGradient id="azb" x1="0" x2="1"><stop offset="0" stop-color="#dfe5ee"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#c7cfdb"/></linearGradient></defs><g class="fl"><path d="M32 96 Q42 136 52 96Z" fill="#FFB347"/><path d="M36 96 Q42 122 48 96Z" fill="#FFF3C4"/></g><path d="M42 4 C58 18 62 40 60 70 L56 92 H28 L24 70 C22 40 26 18 42 4Z" fill="url(#azb)"/><path d="M42 4 C50 11 55 20 57 30 H27 C29 20 34 11 42 4Z" fill="#C8AA6E"/><circle cx="42" cy="50" r="7" fill="#0AC8B9" stroke="#0d1424" stroke-width="3"/><path d="M26 70 L12 90 L26 88Z M58 70 L72 90 L58 88Z" fill="#E2483B"/><rect x="30" y="90" width="24" height="7" rx="2" fill="#2b2f3a"/></svg>';
 function el(cls,html){var o=document.createElement('div');o.className='azl '+cls;o.innerHTML='<div class="sp"></div><div class="rk">'+RK+'</div>'+(html||'');document.body.appendChild(o);return o}
 function raf2(f){requestAnimationFrame(function(){requestAnimationFrame(f)})}
 var framed=false;try{framed=window.top!==window&&!!window.top.__azShell}catch(e){}
 var isHome=!framed&&window.top===window&&/\/Orbit\/(index\.html)?$/i.test(location.pathname);

 /* ---- the shell: Orbit's window hosts Arizona and Carfolio, so the screen is always the full screen ---- */
 if(isHome){
  var fr=null;
  window.__azInsets=function(){var d=document.createElement('div');d.style.cssText='position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';document.body.appendChild(d);var c=getComputedStyle(d),r={t:c.paddingTop,r:c.paddingRight,b:c.paddingBottom,l:c.paddingLeft};d.remove();return r};
  var frame=function(){if(!fr){fr=document.createElement('iframe');fr.id='azframe';fr.title='Arizona';document.body.appendChild(fr)}return fr};
  var isOrbit=function(u){return u.origin===location.origin&&u.pathname.replace(/index\.html$/i,'')===location.pathname.replace(/index\.html$/i,'')};
  var show=function(url,cb){var u=new URL(url,location.href),done=false,fin=function(){if(done)return;done=true;cb&&cb(u)};
   if(isOrbit(u)){if(fr){fr.style.display='none';fr.src='about:blank'}document.documentElement.style.overflow='';document.body.style.overflow='';fin();return}
   var f=frame();f.onload=fin;setTimeout(fin,5000);f.src=u.href;f.style.display='block';document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'};
  window.__azShell={show:show};
  window.azLaunch=function(url,to){var o=el('','<div class="tx">DESPEGANDO A<b>'+(to||'')+'</b></div>');raf2(function(){o.classList.add('go')});try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
   setTimeout(function(){o.classList.add('hold');show(url,function(u){
     if(/\/carfolio\//i.test(u.pathname)){setTimeout(function(){o.classList.add('out');setTimeout(function(){o.remove()},700)},150);return}
     o.remove();var l=el('land');raf2(function(){l.classList.add('in');setTimeout(function(){l.classList.add('out')},750);setTimeout(function(){l.remove()},1800)})})},1500)};
  var start=function(){var s=window.__azStart;if(s){window.__azStart=null;show(s)}};
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
 }
 /* ---- inside the shell: hand the trip to Orbit's window ---- */
 else if(framed){
  window.azLaunch=function(url,to){try{window.top.azLaunch(new URL(url,location.href).href,to)}catch(e){location.href=url}};
 }
 /* ---- opened on its own (a browser tab): travel by navigation ---- */
 else{
  window.azLaunch=function(url,to){var o=el('','<div class="tx">DESPEGANDO A<b>'+(to||'')+'</b></div>');try{sessionStorage.setItem('az.land','1')}catch(e){}raf2(function(){o.classList.add('go')});setTimeout(function(){location.href=url},1500)};
  var land=function(){var f;try{f=sessionStorage.getItem('az.land');sessionStorage.removeItem('az.land')}catch(e){}if(!f||document.getElementById('cf-splash'))return;
   var o=el('land');raf2(function(){o.classList.add('in');setTimeout(function(){o.classList.add('out')},750);setTimeout(function(){o.remove()},1800)})};
  if(document.body)land();else document.addEventListener('DOMContentLoaded',land);
 }
 document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-launch]');if(!a)return;e.preventDefault();e.stopPropagation();azLaunch(a.getAttribute('href')||a.dataset.href,a.dataset.launch)},true);
})();
</script>
