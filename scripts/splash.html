<style>
#cf-splash{position:fixed;inset:0;height:var(--app-h,100%);z-index:2147482000;background:radial-gradient(110% 70% at 50% 60%,#1a1236 0%,#06040d 60%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease}
#cf-splash.out{opacity:0;pointer-events:none}
.cfs-lines{position:absolute;inset:0 -50%;background:repeating-linear-gradient(0deg,transparent 0 46px,rgba(196,181,253,.16) 46px 47px,transparent 47px 93px);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);animation:cfsl .5s linear infinite;opacity:.8}
@keyframes cfsl{to{transform:translateX(-120px)}}
.cfs-car{width:190px;transform:translateX(-120vw);animation:cfsin 1.1s cubic-bezier(.15,.8,.25,1) .1s forwards}
.cfs-car svg{display:block;width:100%;filter:drop-shadow(0 0 22px rgba(167,139,250,.7))}
.cfs-car>svg{animation:cfsbob 1.6s ease-in-out infinite}
@keyframes cfsin{to{transform:translateX(0)}}
@keyframes cfsbob{50%{transform:translateY(-7px) rotate(-1.5deg)}}
#cf-splash.out .cfs-car{animation:cfsout .6s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes cfsout{from{transform:translateX(0)}to{transform:translateX(130vw) translateY(-40px)}}
.cfs-hv{transform-origin:50% 62px;animation:cfshv .12s ease-in-out infinite alternate}
@keyframes cfshv{to{transform:scaleY(1.45);opacity:.65}}
.cfs-name{margin-top:22px;font:600 26px/1 'Rajdhani','Barlow Condensed',-apple-system,system-ui,sans-serif;letter-spacing:.42em;padding-left:.42em;color:#fff;opacity:0;animation:cfsfade .6s ease .7s forwards}
.cfs-sub{margin-top:10px;font:500 12px -apple-system,system-ui,sans-serif;letter-spacing:.08em;color:#8f86b3;opacity:0;animation:cfsfade .6s ease .9s forwards}
@keyframes cfsfade{to{opacity:1}}
</style>
<script>
(function(){var t0=Date.now(),done=false;function go(){if(done)return;done=true;var w=Math.max(0,2300-(Date.now()-t0));setTimeout(function(){var s=document.getElementById('cf-splash');if(!s)return;s.classList.add('out');setTimeout(function(){s.remove()},700)},w)}
 if(window.__cfReady)go();window.addEventListener('carfolio-ready',go);setTimeout(go,9000)})();
